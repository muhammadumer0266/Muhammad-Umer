[project]
name = "muhammad-umer-portfolio"
version = "0.1.0"
description = "Personal portfolio and blog for Muhammad Umer, Django developer and AI engineer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.11",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "celery>=5.4",
    "redis>=5.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "django-csp>=3.8",
    "django-ratelimit>=4.1",
    "django-axes>=6.5",
    "django-otp>=1.5",
    "qrcode>=7.4",
    "structlog>=24.4",
    "sentry-sdk>=2.13",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
    "pygments>=2.18",
    "pillow>=10.4",
    "django-htmx>=1.19",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs>=3.15",
    "djlint>=1.35",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "factory-boy>=3.3",
    "hypothesis>=6.112",
    "playwright>=1.47",
    "pytest-playwright>=0.5",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "pre-commit>=3.8",
    "pyyaml>=6.0",
    "locust>=2.31",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "C4", "SIM", "PT", "RUF"]
# S101: assert is how pytest works. RUF012: Django Meta/ModelAdmin classes are
# full of mutable class-attribute literals (ordering, list_display, ...) by
# design; there is no mutation risk since Django never mutates them at runtime.
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"**/tests/*" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

# factory-boy's DjangoModelFactory metaclass isn't understood by mypy (its
# `Meta.model` -> return-type inference has no stub support), which produces
# false positives on every factory call site. Test modules are exercised by
# pytest itself; excluding them from mypy is the documented workaround.
[[tool.mypy.overrides]]
module = "apps.*.tests.*"
ignore_errors = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db -p no:cacheprovider"
testpaths = ["tests", "apps"]

[tool.coverage.run]
source = ["apps"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
