services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      # Required, never defaulted: compose refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["web"]
    env_file: .env
    volumes:
      - media:/app/media
      # Resumes: mounted into Django only, never into Caddy, so there is no
      # public URL for them -- they're streamed after the email gate.
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Deliberately no public port: Django is reachable only through Caddy.
    # Publishing 8000 would let clients bypass TLS and the security headers,
    # and forge X-Forwarded-For/-Proto. For local debugging only, bind to
    # loopback: ports: ["127.0.0.1:8000:8000"]
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["worker"]
    env_file: .env
    volumes:
      - media:/app/media
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["beat"]
    env_file: .env
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    environment:
      # Caddy gets its TLS certificate and host routing from this. Without it
      # the Caddyfile falls back to "localhost" and the real domain 404s.
      SITE_DOMAIN: ${SITE_DOMAIN:-muhammadumer.tech}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - media:/srv/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  media:
  private_media:
